<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="700" viewBox="0 0 1500 700">
<rect width="1500" height="700" rx="28" fill="#080c16"/>
<text x="750" y="55" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#f2f6ff">HybridPANDAModel — current c.py implementation</text>
<text x="750" y="90" text-anchor="middle" font-family="Arial" font-size="18" fill="#97a2b5">12 tiles → ResNet50 attention + 156-D topology → learned feature fusion → 6 ISUP logits</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#97a2b5"/></marker></defs>
<rect x="70" y="160" width="220" height="90" rx="18" fill="#111725" stroke="#e867aa" stroke-width="3"/><text x="180" y="195" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#f2f6ff">12 RGB tiles</text><text x="180" y="224" text-anchor="middle" font-family="Arial" font-size="16" fill="#97a2b5">128 × 128 each</text>
<rect x="380" y="145" width="250" height="120" rx="18" fill="#111725" stroke="#56cddd" stroke-width="3"/><text x="505" y="185" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#f2f6ff">ResNet50</text><text x="505" y="216" text-anchor="middle" font-family="Arial" font-size="17" fill="#97a2b5">2048-D per tile</text><text x="505" y="242" text-anchor="middle" font-family="Arial" font-size="16" fill="#97a2b5">ImageNet initialized</text>
<rect x="720" y="145" width="250" height="120" rx="18" fill="#111725" stroke="#56cddd" stroke-width="3"/><text x="845" y="185" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#f2f6ff">Tile attention</text><text x="845" y="216" text-anchor="middle" font-family="Arial" font-size="17" fill="#97a2b5">2048 → 128 → 1</text><text x="845" y="242" text-anchor="middle" font-family="Arial" font-size="16" fill="#97a2b5">softmax weighted sum</text>
<rect x="70" y="420" width="220" height="90" rx="18" fill="#111725" stroke="#9a72ac" stroke-width="3"/><text x="180" y="455" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#f2f6ff">Stacked image</text><text x="180" y="485" text-anchor="middle" font-family="Arial" font-size="16" fill="#97a2b5">grayscale + multiscale</text>
<rect x="380" y="390" width="250" height="150" rx="18" fill="#111725" stroke="#9a72ac" stroke-width="3"/><text x="505" y="430" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#f2f6ff">Cubical persistence</text><text x="505" y="462" text-anchor="middle" font-family="Arial" font-size="17" fill="#97a2b5">H₀ components · H₁ holes</text><text x="505" y="490" text-anchor="middle" font-family="Arial" font-size="16" fill="#97a2b5">stats + Betti + PI + landscapes</text><text x="505" y="518" text-anchor="middle" font-family="Arial" font-size="16" fill="#f0d35e">actual vector: 156-D</text>
<rect x="720" y="405" width="250" height="120" rx="18" fill="#111725" stroke="#9a72ac" stroke-width="3"/><text x="845" y="445" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#f2f6ff">TDA branch</text><text x="845" y="478" text-anchor="middle" font-family="Arial" font-size="17" fill="#97a2b5">156 → 64 → 64</text><text x="845" y="504" text-anchor="middle" font-family="Arial" font-size="16" fill="#97a2b5">learned embedding</text>
<rect x="1080" y="245" width="330" height="200" rx="22" fill="#111725" stroke="#78c487" stroke-width="4"/><text x="1245" y="290" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#f2f6ff">Feature fusion</text><text x="1245" y="328" text-anchor="middle" font-family="Arial" font-size="18" fill="#97a2b5">CNN 2048-D + TDA 64-D</text><text x="1245" y="361" text-anchor="middle" font-family="Arial" font-size="18" fill="#97a2b5">→ MLP classifier</text><text x="1245" y="394" text-anchor="middle" font-family="Arial" font-size="17" fill="#97a2b5">256 → 128 → 6</text><text x="1245" y="425" text-anchor="middle" font-family="Arial" font-size="18" fill="#f0d35e">ISUP 0…5</text>
<line x1="290" y1="205" x2="380" y2="205" stroke="#97a2b5" stroke-width="3" marker-end="url(#a)"/><line x1="630" y1="205" x2="720" y2="205" stroke="#97a2b5" stroke-width="3" marker-end="url(#a)"/><line x1="970" y1="205" x2="1080" y2="300" stroke="#97a2b5" stroke-width="3" marker-end="url(#a)"/>
<line x1="290" y1="465" x2="380" y2="465" stroke="#97a2b5" stroke-width="3" marker-end="url(#a)"/><line x1="630" y1="465" x2="720" y2="465" stroke="#97a2b5" stroke-width="3" marker-end="url(#a)"/><line x1="970" y1="465" x2="1080" y2="390" stroke="#97a2b5" stroke-width="3" marker-end="url(#a)"/>
<text x="750" y="650" text-anchor="middle" font-family="Arial" font-size="17" fill="#97a2b5">The research report also documents a separate 70/30 late-probability ensemble variant.</text>
</svg>